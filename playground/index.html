<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenVessel Playground</title>
<link rel="stylesheet" href="./xterm.css">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <strong>OpenVessel</strong>
  <button id="sample">サンプル</button>
  <label class="btn">フォルダ<input id="folder" type="file" webkitdirectory hidden></label>
  <button data-cmd="npm install">install</button>
  <button data-cmd="npm run dev">dev</button>
  <button data-cmd="npm run build">build</button>
  <span class="spacer"></span>
  <label>通信 <select id="mode"><option value="ask">都度確認</option><option value="allowlist">許可リストのみ</option><option value="allow-all">全部許可</option></select></label>
</header>
<main>
  <section id="left"><div id="term"></div></section>
  <section id="right">
    <div id="bar"><span id="ports">サーバーなし</span><button id="reload" title="再読み込み">↻</button></div>
    <div id="preview"></div>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
